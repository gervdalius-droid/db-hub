<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>db-hub — leads</title>
<style>
:root{--bg:#0D1311;--panel:#151D1A;--line:#2C3A35;--text:#EAF0ED;--soft:#B7C4BF;--muted:#A3B2AC;--accent:#FF7A1A;--teal:#5EEAD4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;color:var(--text);background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:32px 0 12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
button,input,select,textarea{font:inherit}
.btn{min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.btn.go{background:var(--accent);border-color:var(--accent);color:#0D1311;font-weight:600}
input,select,textarea{background:#0D1311;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--soft)}
.msg{color:#FCA5A5;min-height:20px;font-size:14px}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.kpi{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel)}
tr:last-child td{border-bottom:0}
td small{color:var(--muted);display:block}
pre{margin:6px 0 0;white-space:pre-wrap;font:inherit;font-size:13px;color:var(--soft)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--soft)}
.empty{padding:24px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>

<form class="login" id="login" hidden>
  <h1>db-hub leads</h1>
  <label>Email<input id="email" type="email" autocomplete="username" required></label>
  <label>Password<input id="pass" type="password" autocomplete="current-password" required></label>
  <button class="btn go" type="submit">Sign in</button>
  <div class="msg" id="loginMsg" role="alert"></div>
</form>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>db-hub leads</h1>
    <div><span id="who" style="color:var(--muted);margin-right:12px"></span><button class="btn" id="refresh" type="button">Refresh</button> <button class="btn" id="out" type="button">Sign out</button></div>
  </div>
  <div class="msg" id="appMsg" role="alert"></div>
  <div class="kpis" id="kpis"></div>

  <h2>Trial requests</h2>
  <div class="scroll"><table><thead><tr><th>When</th><th>Who</th><th>Workshop</th><th>Plan</th><th>Message and demo</th><th>Status</th><th>Notes</th></tr></thead><tbody id="leads"></tbody></table></div>

  <h2>Demo activity <span style="font-weight:400;color:var(--muted);font-size:14px">(visitors who used the live demo, newest first)</span></h2>
  <div class="scroll"><table><thead><tr><th>When</th><th>Cabinets</th><th>Parts</th><th>Sheets</th><th>Demo quote</th><th>Did</th><th>Came from</th></tr></thead><tbody id="demos"></tbody></table></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Public project address and publishable key: safe to ship. The tables are readable only
// by signed-in people whose email is listed in the "admins" table.
const db = createClient('https://preatnukvhwarytlpxpe.supabase.co', 'sb_publishable_-eLlb35TXBvv_wj-UucrqA_g-nxGWd1');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (t) => new Date(t).toLocaleString('lt-LT', { dateStyle: 'short', timeStyle: 'short' });
const STATUSES = ['new', 'contacted', 'trial', 'won', 'lost'];

async function show() {
  const { data: { session } } = await db.auth.getSession();
  $('login').hidden = !!session; $('app').hidden = !session;
  if (!session) return;
  $('who').textContent = session.user.email;
  load();
}

async function load() {
  $('appMsg').textContent = '';
  const [L, D] = await Promise.all([
    db.from('leads').select('*').order('created_at', { ascending: false }).limit(500),
    db.from('demo_sessions').select('*').order('updated_at', { ascending: false }).limit(300),
  ]);
  if (L.error || D.error) { $('appMsg').textContent = 'Could not load: ' + (L.error || D.error).message; return; }
  const leads = L.data, demos = D.data;
  if (!leads.length && !demos.length) {
    const { data: me } = await db.from('admins').select('email').limit(1);
    if (!me || !me.length) $('appMsg').textContent = 'You are signed in, but this email is not on the admin list, so nothing is shown.';
  }
  const week = Date.now() - 7 * 864e5;
  $('kpis').innerHTML = [
    [leads.filter((l) => l.status === 'new').length, 'new requests'],
    [leads.filter((l) => new Date(l.created_at) > week).length, 'requests in 7 days'],
    [demos.filter((d) => new Date(d.created_at) > week).length, 'demo users in 7 days'],
    [demos.filter((d) => d.downloaded_cut_list).length, 'downloaded a cut list'],
  ].map(([n, t]) => `<div class="kpi"><b>${n}</b><span>${t}</span></div>`).join('');

  $('leads').innerHTML = leads.map((l) => `<tr>
    <td>${when(l.created_at)}${l.notified_at ? '<small>emailed</small>' : ''}</td>
    <td>${esc(l.name)}<small><a href="mailto:${esc(l.email)}" style="color:var(--teal)">${esc(l.email)}</a></small><small>${esc(l.phone || '')}</small></td>
    <td>${esc(l.company)}<small>${l.people ? esc(l.people) + ' people' : ''}</small></td>
    <td>${esc(l.plan || '')}</td>
    <td>${esc(l.message || '')}${l.demo_summary ? `<pre>${esc(l.demo_summary)}</pre>` : (l.demo_session_id ? '<small>used the demo</small>' : '')}</td>
    <td><select data-id="${l.id}" data-f="status" aria-label="Status">${STATUSES.map((s) => `<option${s === l.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
    <td><textarea data-id="${l.id}" data-f="notes" rows="2" aria-label="Notes" style="width:180px">${esc(l.notes || '')}</textarea></td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">No trial requests yet.</td></tr>';

  $('demos').innerHTML = demos.map((d) => `<tr>
    <td>${when(d.updated_at)}</td>
    <td>${d.cabinet_count}<pre>${esc(d.summary || '')}</pre></td>
    <td>${d.parts ?? ''}</td><td>${d.sheets ?? ''}</td>
    <td>${d.quote_eur != null ? '€' + Number(d.quote_eur).toLocaleString('en-US') : ''}</td>
    <td>${d.downloaded_cut_list ? '<span class="tag">cut list</span> ' : ''}${d.opened_trial_form ? '<span class="tag">trial form</span>' : ''}</td>
    <td><small>${esc(d.referrer || 'direct')}</small></td>
  </tr>`).join('') || '<tr><td colspan="7" class="empty">Nobody has used the demo yet.</td></tr>';
}

$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginMsg').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) { $('loginMsg').textContent = 'Sign-in failed. Check the email and password.'; return; }
  $('pass').value = ''; show();
});
$('out').addEventListener('click', async () => { await db.auth.signOut(); show(); });
$('refresh').addEventListener('click', load);
$('leads').addEventListener('change', async (e) => {
  const el = e.target.closest('[data-id]'); if (!el) return;
  const { error } = await db.from('leads').update({ [el.dataset.f]: el.value }).eq('id', el.dataset.id);
  $('appMsg').textContent = error ? 'Could not save: ' + error.message : '';
});
show();
</script>
</body>
</html>
